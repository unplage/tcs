<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>贪吃蛇进化论 | 精致摇杆·全面优化</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="manifest" href="./manifest.json">
    <style>
        /* 全局基础样式 - 不全局禁用触摸动作，仅针对需要精确控制的元素单独设置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #0a0f1e 0%, #0c1222 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 8px 40px 8px;
            touch-action: pan-y;          /* 允许页面垂直滚动，但不影响内部控件 */
            overflow-y: auto;
        }
        .header {
            text-align: center;
            width: 100%;
            max-width: 550px;
            margin-bottom: 6px;
        }
        h1 {
            font-size: 1.8rem;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #FFD966, #FF8C42, #FF3C8E);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .subtitle {
            font-size: 0.7rem;
            color: #9aa4bf;
        }
        .game-container {
            max-width: 550px;
            width: 100%;
            background: rgba(18, 25, 45, 0.75);
            backdrop-filter: blur(4px);
            border-radius: 36px;
            padding: 12px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5);
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stats-row {
            display: flex;
            gap: 8px;
            justify-content: space-between;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .stat-card {
            background: rgba(0,0,0,0.5);
            border-radius: 24px;
            padding: 5px 8px;
            flex: 1;
            text-align: center;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .stat-value {
            font-size: 1.4rem;
            font-weight: 800;
            line-height: 1.2;
            color: #FFE484;
        }
        .stat-label {
            font-size: 0.6rem;
            opacity: 0.8;
        }
        .mode-bar {
            display: flex;
            gap: 6px;
            margin: 8px 0;
            background: #0f1629;
            padding: 5px;
            border-radius: 60px;
            touch-action: pan-y;          /* 允许轻微滚动但按钮点击仍精确 */
        }
        .mode-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 6px 4px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.75rem;
            color: #b9c3e6;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .mode-btn.active {
            background: linear-gradient(95deg, #3a3f6e, #2a2f55);
            color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .difficulty-selector {
            display: flex;
            gap: 5px;
            margin: 8px 0;
        }
        .difficulty-btn {
            flex: 1;
            background: rgba(255,255,255,0.08);
            border: none;
            border-radius: 30px;
            padding: 6px 0;
            font-size: 0.65rem;
            font-weight: bold;
            color: #ccc;
        }
        .difficulty-btn.active {
            background: #ffb347;
            color: #0f0f1f;
            box-shadow: 0 0 6px #ffb347;
        }
        /* 摇杆外圆100px，内圆60px不变 - 精确触摸控制，禁止滚动 */
        .joystick-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 12px auto 6px;
            width: 100%;
            touch-action: none;           /* 摇杆区域禁止页面滚动 */
        }
        .joystick-base {
            position: relative;
            width: 100px;
            height: 100px;
            background: rgba(30, 40, 65, 0.95);
            border-radius: 50%;
            box-shadow: 0 6px 16px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }
        .joystick-thumb {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #f0f0f0, #c0c0e0);
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            transition: transform 0.02s linear;
            pointer-events: auto;
            will-change: transform;
            border: 2px solid rgba(255,255,255,0.7);
            cursor: grab;
            touch-action: none;
        }
        .joystick-thumb:active {
            cursor: grabbing;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin: 12px 0 6px;
        }
        .action-btn {
            flex: 1;
            padding: 8px 0;
            border-radius: 40px;
            font-weight: bold;
            background: #2c314e;
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 0.8rem;
            touch-action: manipulation;
        }
        .start-btn { background: #2ecc71; color: #000; }
        .pause-btn { background: #e67e22; }
        .restart-btn { background: #3498db; }
        
        /* 荣誉殿堂容器 - 必须支持垂直滑动 */
        .scoreboard-container {
            max-width: 550px;
            width: 100%;
            background: rgba(0,0,0,0.5);
            border-radius: 28px;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 8px;
            touch-action: pan-y;           /* 允许垂直滚动 */
        }
        /* 分数列表滚动区域 */
        #scoreList {
            list-style: none;
            max-height: 140px;
            overflow-y: auto;
            padding: 0 6px;
            margin: 0;
            touch-action: pan-y;           /* 确保列表内可滚动 */
            -webkit-overflow-scrolling: touch;
        }
        /* 自定义滚动条样式（可选） */
        #scoreList::-webkit-scrollbar {
            width: 4px;
        }
        #scoreList::-webkit-scrollbar-track {
            background: #2a2f55;
            border-radius: 4px;
        }
        #scoreList::-webkit-scrollbar-thumb {
            background: #ffb347;
            border-radius: 4px;
        }
        
        .toast-msg {
            position: fixed;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            background: #000000cc;
            backdrop-filter: blur(12px);
            padding: 5px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #FFD966;
            pointer-events: none;
            z-index: 200;
            white-space: nowrap;
            animation: fadePop 1.2s forwards;
        }
        @keyframes fadePop {
            0% { opacity: 0; transform: translate(-50%, 10px);}
            15% { opacity: 1; transform: translate(-50%, -5px);}
            85% { opacity: 1; transform: translate(-50%, -5px);}
            100% { opacity: 0; transform: translate(-50%, -20px);}
        }
        .swipe-hint {
            font-size: 0.6rem;
            text-align: center;
            color: #8e99c0;
            margin-top: 6px;
        }
        /* 游戏画布区域，禁止滚动以保证滑动控制精准 */
        .game-area {
            touch-action: none;
            position: relative;
        }
        canvas {
            width: 100%;
            height: 100%;
            background: #0b1120;
            display: block;
            touch-action: none;
        }
        @media (max-width: 460px) {
            .joystick-base { width: 90px; height: 90px; }
            .joystick-thumb { width: 55px; height: 55px; }
            .stat-value { font-size: 1.2rem; }
            .action-btn { padding: 6px 0; font-size: 0.7rem; }
        }
    </style>
</head>
<body>
<div class="header">
    <h1><i class="fas fa-dragon"></i> 贪吃蛇·进化论</h1>
    <div class="subtitle">100px 精致摇杆 | 多重模式 | 连击狂暴</div>
</div>

<div class="game-container">
    <div class="stats-row">
        <div class="stat-card"><div class="stat-value" id="score">0</div><div class="stat-label">分数</div></div>
        <div class="stat-card"><div class="stat-value" id="highScore">0</div><div class="stat-label">巅峰纪录</div></div>
        <div class="stat-card"><div class="stat-value" id="length">3</div><div class="stat-label">长度</div></div>
        <div class="stat-card" id="modeExtraStat"><div class="stat-value" id="extraInfo">-</div><div class="stat-label" id="extraLabel">模式</div></div>
    </div>
    <div class="mode-bar">
        <button class="mode-btn" data-mode="classic"><i class="fas fa-crown"></i> 经典</button>
        <button class="mode-btn" data-mode="timed"><i class="fas fa-hourglass-half"></i> 限时狂潮</button>
        <button class="mode-btn" data-mode="survival"><i class="fas fa-bolt"></i> 生存极速</button>
    </div>
    <div class="difficulty-selector" id="difficultyGroup">
        <button class="difficulty-btn" data-diff="easy"><i class="fas fa-leaf"></i> 简单</button>
        <button class="difficulty-btn" data-diff="medium" class="active"><i class="fas fa-chart-line"></i> 中等</button>
        <button class="difficulty-btn" data-diff="hard"><i class="fas fa-skull"></i> 困难</button>
        <button class="difficulty-btn" data-diff="insane"><i class="fas fa-demon"></i> 疯狂</button>
    </div>

    <div class="game-area">
        <canvas id="gameCanvas"></canvas>
        <div class="game-over" id="gameOverScreen" style="position:absolute; inset:0; background:rgba(0,0,0,0.92); border-radius:24px; display:none; flex-direction:column; align-items:center; justify-content:center; z-index:20;">
            <h2 style="color:#ff6b6b; font-size:1.8rem;">GAME OVER</h2>
            <div class="final-score" id="finalScore" style="font-size:2rem; margin:8px;">0</div>
            <div style="display:flex; gap:12px; margin-top:10px;">
                <button class="action-btn restart-btn" id="restartGameOverBtn"><i class="fas fa-redo"></i> 重来</button>
                <button class="action-btn start-btn" id="menuBackBtn"><i class="fas fa-home"></i> 菜单</button>
            </div>
        </div>
        <div class="swipe-hint"><i class="fas fa-hand-peace"></i> 按住圆形摇杆滑动 | 键盘方向键 | 屏幕滑动</div>
    </div>

    <!-- 外圆100px，内圆60px 摇杆 -->
    <div class="joystick-container">
        <div class="joystick-base" id="joystickBase">
            <div class="joystick-thumb" id="joystickThumb"></div>
        </div>
    </div>

    <div class="action-buttons">
        <button class="action-btn start-btn" id="startBtn"><i class="fas fa-play"></i> 开始</button>
        <button class="action-btn pause-btn" id="pauseBtn"><i class="fas fa-pause"></i> 暂停</button>
        <button class="action-btn restart-btn" id="restartBtn"><i class="fas fa-sync-alt"></i> 重玩</button>
    </div>
</div>

<div class="scoreboard-container">
    <h3 style="text-align:center; color:#FFD966; font-size:1.1rem;"><i class="fas fa-trophy"></i> 荣誉殿堂</h3>
    <ul id="scoreList"></ul>
</div>

<script>
    (function(){
        // ---------- DOM ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let gridUnit = 20;
        let gridW = 20, gridH = 20;
        
        // 游戏状态
        let snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
        let direction = 'right', nextDir = 'right';
        let score = 0, highScore = 0;
        let isPaused = true, isGameOver = false;
        let gameInterval = null;
        let currentSpeed = 140;
        let currentDifficulty = 'medium';
        let currentMode = 'classic';
        let obstacles = [];
        
        // 特殊食物
        let specialFood = null;
        let specialTimer = 0;
        let specialFoodActive = false;
        let specialInterval = null;
        
        // 连击系统
        let combo = 0;
        let lastEatTimestamp = 0;
        let comboTimeout = null;
        
        // 限时模式
        let timeLeft = 60;
        let timedModeInterval = null;
        
        // 食物
        let food = {x:15, y:10};
        
        // 控制防抖
        let canChange = true;
        let touchStart = {x:0,y:0};
        
        // UI 元素
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const lengthEl = document.getElementById('length');
        const extraInfo = document.getElementById('extraInfo');
        const extraLabel = document.getElementById('extraLabel');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreSpan = document.getElementById('finalScore');
        
        // ---------- 摇杆逻辑 (外圆100,内圆60，最大偏移20px) ----------
        const joystickBase = document.getElementById('joystickBase');
        const joystickThumb = document.getElementById('joystickThumb');
        let activeJoystick = false;
        let joystickCenter = { x: 0, y: 0 };
        let joystickRadius = 20;   // 外圆半径50 - 内圆半径30 = 20px最大偏移
        
        function updateJoystickCenter() {
            const rect = joystickBase.getBoundingClientRect();
            joystickCenter.x = rect.left + rect.width / 2;
            joystickCenter.y = rect.top + rect.height / 2;
            const outerR = rect.width / 2;
            const thumbR = joystickThumb.offsetWidth / 2;
            joystickRadius = Math.max(5, outerR - thumbR);
        }
        
        function getDirectionFromVector(dx, dy) {
            const absX = Math.abs(dx);
            const absY = Math.abs(dy);
            if (absX < 12 && absY < 12) return null;
            if (absX > absY) {
                return dx > 0 ? 'right' : 'left';
            } else {
                return dy > 0 ? 'down' : 'up';
            }
        }
        
        function setJoystickPosition(clientX, clientY) {
            if (!activeJoystick) return;
            let deltaX = clientX - joystickCenter.x;
            let deltaY = clientY - joystickCenter.y;
            let distance = Math.hypot(deltaX, deltaY);
            let maxDist = joystickRadius;
            if (distance > maxDist) {
                deltaX = (deltaX / distance) * maxDist;
                deltaY = (deltaY / distance) * maxDist;
            }
            joystickThumb.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
            let dir = getDirectionFromVector(deltaX, deltaY);
            if (dir) {
                changeDirectionFromJoystick(dir);
            }
        }
        
        function resetJoystick() {
            joystickThumb.style.transform = `translate(0px, 0px)`;
            activeJoystick = false;
        }
        
        function handleJoystickStart(e) {
            e.preventDefault();
            e.stopPropagation();
            activeJoystick = true;
            updateJoystickCenter();
            const point = e.touches ? e.touches[0] : e;
            let deltaX = point.clientX - joystickCenter.x;
            let deltaY = point.clientY - joystickCenter.y;
            let distance = Math.hypot(deltaX, deltaY);
            let maxDist = joystickRadius;
            if (distance > maxDist) {
                deltaX = (deltaX / distance) * maxDist;
                deltaY = (deltaY / distance) * maxDist;
            }
            joystickThumb.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
            let dir = getDirectionFromVector(deltaX, deltaY);
            if (dir) changeDirectionFromJoystick(dir);
        }
        
        function handleJoystickMove(e) {
            if (!activeJoystick) return;
            e.preventDefault();
            e.stopPropagation();
            const point = e.touches ? e.touches[0] : e;
            setJoystickPosition(point.clientX, point.clientY);
        }
        
        function handleJoystickEnd(e) {
            if (!activeJoystick) return;
            e.preventDefault();
            e.stopPropagation();
            resetJoystick();
        }
        
        joystickThumb.addEventListener('touchstart', handleJoystickStart, { passive: false });
        joystickThumb.addEventListener('mousedown', handleJoystickStart);
        window.addEventListener('touchmove', handleJoystickMove, { passive: false });
        window.addEventListener('touchend', handleJoystickEnd);
        window.addEventListener('touchcancel', handleJoystickEnd);
        window.addEventListener('mousemove', (e) => { if (activeJoystick) handleJoystickMove(e); });
        window.addEventListener('mouseup', handleJoystickEnd);
        joystickBase.addEventListener('touchstart', (e) => e.preventDefault());
        joystickBase.addEventListener('mousedown', (e) => e.preventDefault());
        
        function changeDirectionFromJoystick(newDir) {
            if (isPaused || isGameOver || !canChange) return;
            if (
                (newDir === 'up' && direction !== 'down') ||
                (newDir === 'down' && direction !== 'up') ||
                (newDir === 'left' && direction !== 'right') ||
                (newDir === 'right' && direction !== 'left')
            ) {
                nextDir = newDir;
                canChange = false;
            }
        }
        function keyboardChange(newDir) { changeDirectionFromJoystick(newDir); }
        
        // ---------- 游戏核心函数 ----------
        function resizeCanvas() {
            const container = document.querySelector('.game-area');
            const size = container.clientWidth;
            canvas.width = size;
            canvas.height = size;
            gridUnit = size / gridW;
            draw();
        }
        window.addEventListener('resize', resizeCanvas);
        
        function updateUI() {
            scoreEl.innerText = score;
            lengthEl.innerText = snake.length;
            if(score > highScore) { highScore = score; localStorage.setItem('snakeHS', highScore); highScoreEl.innerText = highScore; }
            if(currentMode === 'timed') {
                extraInfo.innerText = `${Math.ceil(timeLeft)}s`;
                extraLabel.innerText = '倒计时';
            } else if(currentMode === 'survival') {
                let spdVal = Math.floor(1000/currentSpeed);
                extraInfo.innerText = `${spdVal}ms`;
                extraLabel.innerText = '反应速度';
            } else {
                extraInfo.innerText = '∞';
                extraLabel.innerText = '经典无尽';
            }
        }
        
        function showToast(msg, color='#FFD966') {
            let toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.innerText = msg;
            toast.style.color = color;
            document.body.appendChild(toast);
            setTimeout(()=>toast.remove(), 1200);
        }
        
        function updateComboUI() {
            if(combo > 1) showToast(`⚡ ${combo}连击 x${Math.min(3,1+Math.floor(combo/3))}倍!`, '#FFB347');
        }
        function getComboBonus() { let mult = 1 + Math.floor(combo / 3); return Math.min(mult, 3); }
        function onEat() {
            let now = Date.now();
            if(lastEatTimestamp && (now - lastEatTimestamp) < 1700) combo++;
            else combo = 1;
            lastEatTimestamp = now;
            if(comboTimeout) clearTimeout(comboTimeout);
            comboTimeout = setTimeout(()=>{ combo=0; }, 1800);
            updateComboUI();
        }
        
        function applySpecialEffect(type) {
            if(type === 0) {
                let add = 30 * getComboBonus();
                score += add;
                showToast(`✨ +${add} 黄金盛宴`, '#FFD966');
            } else if(type === 1) {
                if(currentSpeed > 45) { currentSpeed = Math.max(45, currentSpeed - 12); adjustInterval(); showToast(`💨 加速!`, '#77DDFF');}
                else showToast(`⚡已达极速`, '#aaa');
            } else if(type === 2) {
                currentSpeed = Math.min(280, currentSpeed + 25); adjustInterval(); showToast(`🐢 减速缓冲`, '#C58AFF');
            } else if(type === 3) {
                score = Math.max(0, score - 10);
                if(snake.length > 3) snake.pop();
                showToast(`💀 毒果! -10分 长度-1`, '#ff6b6b');
                return;
            }
            let baseAdd = 10 * getComboBonus();
            score += baseAdd;
            updateUI();
        }
        
        function generateFood() {
            let maxAttempts = 2000;
            let newPos;
            let valid = false;
            while(!valid && maxAttempts-- >0) {
                newPos = {x: Math.floor(Math.random()*gridW), y: Math.floor(Math.random()*gridH)};
                valid = true;
                for(let seg of snake) if(seg.x===newPos.x && seg.y===newPos.y) {valid=false;break;}
                if(valid && obstacles.some(o=>o.x===newPos.x && o.y===newPos.y)) valid=false;
                if(valid && specialFoodActive && specialFood.x===newPos.x && specialFood.y===newPos.y) valid=false;
            }
            food = newPos;
        }
        
        function spawnSpecialFood() {
            if(specialFoodActive) return;
            let maxAttempt=500;
            let pos;
            let ok=false;
            let type = Math.random() < 0.25 ? 3 : Math.floor(Math.random()*3);
            while(!ok && maxAttempt-->0){
                pos = {x:Math.floor(Math.random()*gridW), y:Math.floor(Math.random()*gridH)};
                ok = true;
                for(let s of snake) if(s.x===pos.x && s.y===pos.y) {ok=false;break;}
                if(ok && (food.x===pos.x && food.y===pos.y)) ok=false;
                if(ok && obstacles.some(o=>o.x===pos.x && o.y===pos.y)) ok=false;
            }
            if(ok){
                specialFood = {x:pos.x, y:pos.y, type:type};
                specialFoodActive = true;
                specialTimer = 9;
                if(specialInterval) clearInterval(specialInterval);
                specialInterval = setInterval(()=>{
                    if(!specialFoodActive || isPaused || isGameOver) return;
                    specialTimer--;
                    if(specialTimer<=0){ specialFoodActive=false; specialFood=null; clearInterval(specialInterval);}
                },1000);
            }
        }
        
        function genObstacles(){
            obstacles = [];
            if(currentDifficulty !== 'insane' || currentMode !== 'classic') return;
            let count = 6;
            for(let i=0;i<count;i++){
                let pos, ok=false, tries=0;
                while(!ok && tries<300){
                    pos={x:Math.floor(Math.random()*gridW), y:Math.floor(Math.random()*gridH)};
                    ok=true;
                    if(snake.some(s=>s.x===pos.x && s.y===pos.y)) ok=false;
                    if(food.x===pos.x && food.y===pos.y) ok=false;
                    if(specialFoodActive && specialFood.x===pos.x && specialFood.y===pos.y) ok=false;
                    tries++;
                }
                if(ok) obstacles.push(pos);
            }
        }
        
        function fullReset(){
            clearInterval(gameInterval);
            if(timedModeInterval) clearInterval(timedModeInterval);
            if(specialInterval) clearInterval(specialInterval);
            isGameOver = false;
            isPaused = true;
            gameOverScreen.style.display = 'none';
            score = 0;
            combo = 0;
            lastEatTimestamp = 0;
            snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
            direction = 'right';
            nextDir = 'right';
            canChange = true;
            specialFoodActive = false;
            specialFood = null;
            if(currentMode === 'timed') timeLeft = 60;
            if(currentMode === 'classic'){
                let speeds={easy:180, medium:130, hard:85, insane:55};
                currentSpeed = speeds[currentDifficulty] || 130;
            } else if(currentMode === 'timed'){ currentSpeed = 125; }
            else if(currentMode === 'survival'){ currentSpeed = 120; }
            genObstacles();
            generateFood();
            if(!specialFoodActive && Math.random()<0.2) spawnSpecialFood();
            updateUI();
            draw();
            adjustInterval();
            resetJoystick();
            document.getElementById('startBtn').innerHTML = '<i class="fas fa-play"></i> 开始';
            document.getElementById('pauseBtn').innerHTML = '<i class="fas fa-pause"></i> 暂停';
        }
        
        function adjustInterval(){
            if(gameInterval && !isPaused && !isGameOver){
                clearInterval(gameInterval);
                gameInterval = setInterval(gameLoop, currentSpeed);
            }
        }
        
        function endGame(){
            if(isGameOver) return;
            isGameOver = true;
            isPaused = true;
            if(gameInterval) clearInterval(gameInterval);
            if(timedModeInterval) clearInterval(timedModeInterval);
            finalScoreSpan.innerText = score;
            gameOverScreen.style.display = 'flex';
            saveScoreToLeaderboard();
            showToast(`🔥 最终得分 ${score}`, '#ffaa66');
        }
        
        function saveScoreToLeaderboard(){
            let scores = JSON.parse(localStorage.getItem('snakeElite')) || [];
            scores.push({score: score, mode: currentMode, diff: currentDifficulty, date: new Date().toLocaleString()});
            scores.sort((a,b)=>b.score - a.score);
            scores = scores.slice(0,12);
            localStorage.setItem('snakeElite', JSON.stringify(scores));
            renderLeaderboard();
        }
        
        function renderLeaderboard(){
            let scores = JSON.parse(localStorage.getItem('snakeElite')) || [];
            const list = document.getElementById('scoreList');
            if(!list) return;
            list.innerHTML = '';
            if(scores.length===0){ list.innerHTML='<li style="text-align:center; color:#aaa;">暂无记录</li>'; return;}
            scores.forEach((item,idx)=>{
                let li = document.createElement('li');
                li.style.display='flex'; li.style.justifyContent='space-between'; li.style.padding='6px 0'; li.style.borderBottom='1px solid #2a2f55';
                li.innerHTML = `<span>${idx+1}. ${item.score}分</span><span style="font-size:0.65rem;">${item.mode==='classic'?'经典':(item.mode==='timed'?'限时':'生存')} ${item.diff}</span>`;
                list.appendChild(li);
            });
        }
        
        function updateSurvivalSpeed(){
            if(currentMode !== 'survival') return;
            let newSpeed = Math.max(48, 120 - Math.floor(score / 35) * 4);
            if(newSpeed !== currentSpeed){ currentSpeed = newSpeed; adjustInterval(); }
        }
        
        function gameLoop(){
            if(isPaused || isGameOver) return;
            canChange = true;
            direction = nextDir;
            let head = {...snake[0]};
            switch(direction){
                case 'up': head.y--; break;
                case 'down': head.y++; break;
                case 'left': head.x--; break;
                case 'right': head.x++; break;
            }
            if(head.x<0 || head.y<0 || head.x>=gridW || head.y>=gridH){ endGame(); return; }
            if(snake.some(seg=>seg.x===head.x && seg.y===head.y)){ endGame(); return; }
            if(obstacles.some(o=>o.x===head.x && o.y===head.y)){ endGame(); return; }
            
            let ate = false;
            let isSpecialAte = false;
            let specialType = -1;
            if(head.x === food.x && head.y === food.y){
                ate = true;
                onEat();
                let bonusMult = getComboBonus();
                score += 10 * bonusMult;
                generateFood();
                if(!specialFoodActive && Math.random()<0.18) spawnSpecialFood();
                if(currentMode === 'timed') timeLeft = Math.min(99, timeLeft + 2);
                updateUI();
            }
            if(specialFoodActive && head.x === specialFood.x && head.y === specialFood.y){
                isSpecialAte = true;
                specialType = specialFood.type;
                applySpecialEffect(specialType);
                specialFoodActive = false;
                specialFood = null;
                if(specialInterval) clearInterval(specialInterval);
                if(currentMode === 'timed') timeLeft += 3;
                updateUI();
            }
            snake.unshift(head);
            if(!ate && !isSpecialAte) snake.pop();
            if(isSpecialAte && specialType===3) { /* 已处理 */ }
            if(currentMode === 'survival') updateSurvivalSpeed();
            if(currentMode === 'timed' && timeLeft <= 0) endGame();
            updateUI();
            draw();
        }
        
        function startTimedModeCounter(){
            if(timedModeInterval) clearInterval(timedModeInterval);
            if(currentMode !== 'timed') return;
            timedModeInterval = setInterval(()=>{
                if(!isPaused && !isGameOver && currentMode==='timed'){
                    if(timeLeft > 0) { timeLeft--; updateUI(); if(timeLeft<=0) endGame(); }
                    else endGame();
                }
            }, 1000);
        }
        
        function draw(){
            if(!ctx) return;
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = '#0b1120';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.strokeStyle = '#20273f';
            for(let i=0;i<=gridW;i++){ ctx.beginPath(); ctx.moveTo(i*gridUnit,0); ctx.lineTo(i*gridUnit,canvas.height); ctx.stroke(); ctx.moveTo(0,i*gridUnit); ctx.lineTo(canvas.width,i*gridUnit); ctx.stroke(); }
            ctx.fillStyle = '#5a4c3c';
            obstacles.forEach(o=>ctx.fillRect(o.x*gridUnit, o.y*gridUnit, gridUnit-1, gridUnit-1));
            for(let i=0;i<snake.length;i++){
                let g = snake[i];
                let grad = ctx.createLinearGradient(g.x*gridUnit, g.y*gridUnit, (g.x+1)*gridUnit, (g.y+1)*gridUnit);
                if(i===0) { grad.addColorStop(0,'#71f59e'); grad.addColorStop(1,'#37d46b');}
                else { grad.addColorStop(0,'#32a852'); grad.addColorStop(1,'#248f3f');}
                ctx.fillStyle = grad;
                ctx.fillRect(g.x*gridUnit, g.y*gridUnit, gridUnit-1, gridUnit-1);
                if(i===0){
                    ctx.fillStyle='white'; let eSize=gridUnit/5;
                    if(direction==='right'){ ctx.fillRect(g.x*gridUnit+gridUnit-eSize*2, g.y*gridUnit+eSize, eSize, eSize); ctx.fillRect(g.x*gridUnit+gridUnit-eSize*2, g.y*gridUnit+gridUnit-eSize*2, eSize, eSize);}
                    else if(direction==='left'){ ctx.fillRect(g.x*gridUnit+eSize, g.y*gridUnit+eSize, eSize, eSize); ctx.fillRect(g.x*gridUnit+eSize, g.y*gridUnit+gridUnit-eSize*2, eSize, eSize);}
                    else if(direction==='up'){ ctx.fillRect(g.x*gridUnit+eSize, g.y*gridUnit+eSize, eSize, eSize); ctx.fillRect(g.x*gridUnit+gridUnit-eSize*2, g.y*gridUnit+eSize, eSize, eSize);}
                    else { ctx.fillRect(g.x*gridUnit+eSize, g.y*gridUnit+gridUnit-eSize*2, eSize, eSize); ctx.fillRect(g.x*gridUnit+gridUnit-eSize*2, g.y*gridUnit+gridUnit-eSize*2, eSize, eSize);}
                }
            }
            ctx.fillStyle = '#ff4757';
            ctx.beginPath(); ctx.arc(food.x*gridUnit+gridUnit/2, food.y*gridUnit+gridUnit/2, gridUnit/2-2,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#ff8c8c'; ctx.beginPath(); ctx.arc(food.x*gridUnit+gridUnit/3, food.y*gridUnit+gridUnit/3, gridUnit/6,0,Math.PI*2); ctx.fill();
            if(specialFoodActive && specialFood){
                let col = specialFood.type===0?'#FFD966':(specialFood.type===1?'#3cc7ff':(specialFood.type===2?'#bc8eff':'#aa2e4e'));
                ctx.fillStyle = col;
                ctx.beginPath(); ctx.arc(specialFood.x*gridUnit+gridUnit/2, specialFood.y*gridUnit+gridUnit/2, gridUnit/2-1,0,Math.PI*2); ctx.fill();
                ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(specialFood.x*gridUnit+gridUnit/3, specialFood.y*gridUnit+gridUnit/3, gridUnit/7,0,Math.PI*2); ctx.fill();
            }
        }
        
        function startGame(){
            if(isGameOver) fullReset();
            isPaused = false;
            if(gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, currentSpeed);
            if(currentMode==='timed') startTimedModeCounter();
            document.getElementById('startBtn').innerHTML = '<i class="fas fa-check"></i> 游戏中';
        }
        function pauseGame(){ if(isGameOver) return; isPaused = !isPaused; if(isPaused){ clearInterval(gameInterval); if(timedModeInterval) clearInterval(timedModeInterval); } else { gameInterval = setInterval(gameLoop, currentSpeed); if(currentMode==='timed') startTimedModeCounter(); } }
        function restartGame(){ fullReset(); startGame(); }
        
        function setMode(mode){
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn=>{ if(btn.dataset.mode===mode) btn.classList.add('active'); else btn.classList.remove('active'); });
            if(mode !== 'classic') document.querySelectorAll('.difficulty-btn').forEach(btn=>btn.style.opacity='0.5');
            else document.querySelectorAll('.difficulty-btn').forEach(btn=>btn.style.opacity='1');
            fullReset(); draw();
        }
        function setDifficulty(diff){
            if(currentMode !== 'classic') return;
            currentDifficulty = diff;
            document.querySelectorAll('.difficulty-btn').forEach(btn=>{ if(btn.dataset.diff===diff) btn.classList.add('active'); else btn.classList.remove('active'); });
            fullReset(); draw();
        }
        
        // 备用滑动（画布滑动控制方向）
        canvas.addEventListener('touchstart', e=>{ touchStart.x=e.touches[0].clientX; touchStart.y=e.touches[0].clientY; e.preventDefault();});
        canvas.addEventListener('touchend', e=>{
            let dx = e.changedTouches[0].clientX - touchStart.x;
            let dy = e.changedTouches[0].clientY - touchStart.y;
            if(Math.abs(dx)<15 && Math.abs(dy)<15) return;
            if(Math.abs(dx)>Math.abs(dy)) keyboardChange(dx>0?'right':'left');
            else keyboardChange(dy>0?'down':'up');
            e.preventDefault();
        });
        
        window.addEventListener('keydown',(e)=>{
            let k=e.key;
            if(k==='ArrowUp') keyboardChange('up');
            else if(k==='ArrowDown') keyboardChange('down');
            else if(k==='ArrowLeft') keyboardChange('left');
            else if(k==='ArrowRight') keyboardChange('right');
            else if(k===' '||k==='Space'){ e.preventDefault(); if(isGameOver) restartGame(); else if(isPaused) startGame(); else pauseGame(); }
        });
        
        document.getElementById('startBtn').addEventListener('click',startGame);
        document.getElementById('pauseBtn').addEventListener('click',pauseGame);
        document.getElementById('restartBtn').addEventListener('click',restartGame);
        document.getElementById('restartGameOverBtn').addEventListener('click',()=>{ restartGame(); gameOverScreen.style.display='none'; });
        document.getElementById('menuBackBtn').addEventListener('click',()=>{ fullReset(); gameOverScreen.style.display='none'; });
        document.querySelectorAll('.mode-btn').forEach(btn=>btn.addEventListener('click',()=>setMode(btn.dataset.mode)));
        document.querySelectorAll('.difficulty-btn').forEach(btn=>btn.addEventListener('click',()=>setDifficulty(btn.dataset.diff)));
        
        resizeCanvas();
        highScore = localStorage.getItem('snakeHS') ? parseInt(localStorage.getItem('snakeHS')) : 0;
        highScoreEl.innerText = highScore;
        renderLeaderboard();
        fullReset();
        draw();
        updateJoystickCenter();
        window.addEventListener('resize', ()=>{ updateJoystickCenter(); });
    })();
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      console.log('Service Worker 注册成功，作用域:', reg.scope);
    }).catch(err => {
      console.error('Service Worker 注册失败:', err);
    });
  }
</script>
</body>
</html>
