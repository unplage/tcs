<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>贪吃蛇·进化论 v2</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="manifest" href="./manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
      background: linear-gradient(145deg, #0a0f1e 0%, #0c1222 100%);
      color: #fff; min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center;
      padding: 10px 8px 30px 8px; touch-action: pan-y; overflow-y: auto;
    }
    .header { text-align: center; width: 100%; max-width: 550px; margin-bottom: 4px; }
    h1 { font-size: 1.5rem; letter-spacing: 1px; background: linear-gradient(135deg, #FFD966, #FF8C42, #FF3C8E); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .subtitle { font-size: 0.65rem; color: #9aa4bf; }

    .game-container {
      max-width: 550px; width: 100%;
      background: rgba(18, 25, 45, 0.75); backdrop-filter: blur(4px);
      border-radius: 28px; padding: 10px;
      box-shadow: 0 20px 35px rgba(0,0,0,0.5); margin-bottom: 10px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .stats-row { display: flex; gap: 6px; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; }
    .stat-card {
      background: rgba(0,0,0,0.5); border-radius: 20px; padding: 4px 6px; flex: 1;
      text-align: center; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.12);
      position: relative; overflow: hidden;
    }
    .stat-value { font-size: 1.2rem; font-weight: 800; line-height: 1.2; color: #FFE484; }
    .stat-label { font-size: 0.55rem; opacity: 0.7; }

    .mode-bar { display: flex; gap: 4px; margin: 6px 0; background: #0f1629; padding: 4px; border-radius: 40px; }
    .mode-btn {
      flex: 1; background: transparent; border: none; padding: 5px 4px; border-radius: 30px;
      font-weight: 600; font-size: 0.7rem; color: #b9c3e6; transition: 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer;
    }
    .mode-btn.active { background: linear-gradient(95deg, #3a3f6e, #2a2f55); color: white; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }

    .difficulty-selector { display: flex; gap: 4px; margin: 6px 0; }
    .difficulty-btn {
      flex: 1; background: rgba(255,255,255,0.06); border: none; border-radius: 20px;
      padding: 5px 0; font-size: 0.6rem; font-weight: bold; color: #ccc; cursor: pointer; transition: 0.2s;
    }
    .difficulty-btn.active { background: #ffb347; color: #0f0f1f; box-shadow: 0 0 6px #ffb347; }

    .game-area { touch-action: none; position: relative; }
    canvas { width: 100%; height: 100%; background: #0b1120; display: block; touch-action: none; border-radius: 16px; }

    .combo-display {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 2rem; font-weight: 900; color: #FFD700; pointer-events: none; z-index: 10;
      display: none; text-shadow: 0 0 20px rgba(255,215,0,0.5);
    }
    .combo-pop { animation: comboAnim 0.5s ease-out; }
    @keyframes comboAnim {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    .special-timer-container { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin: 4px 0; overflow: hidden; }
    .special-timer-bar { height: 100%; border-radius: 2px; transition: width 0.3s, background 0.3s; display: none; }

    .joystick-container { display: flex; justify-content: center; align-items: center; margin: 8px auto 4px; width: 100%; touch-action: none; }
    .joystick-base {
      position: relative; width: 110px; height: 110px;
      background: rgba(30, 40, 65, 0.95); border-radius: 50%;
      box-shadow: 0 6px 16px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center; touch-action: none;
    }
    .joystick-base::after {
      content: ''; position: absolute; inset: -8px; border-radius: 50%;
      background: transparent; touch-action: none;
    }
    .joystick-thumb {
      position: absolute; width: 60px; height: 60px;
      background: radial-gradient(circle at 30% 30%, #e8e8f0, #a8a8c8);
      border-radius: 50%; box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      transition: transform 0.02s linear; pointer-events: auto;
      will-change: transform; border: 2px solid rgba(255,255,255,0.7);
      cursor: grab; touch-action: none; z-index: 2;
    }
    .joystick-thumb:active { cursor: grabbing; }
    .joystick-base .dir-indicator {
      position: absolute; width: 0; height: 0; border-style: solid; opacity: 0.2;
      pointer-events: none;
    }
    .dir-up { top: 12px; border-width: 0 6px 8px 6px; border-color: transparent transparent #fff transparent; }
    .dir-down { bottom: 12px; border-width: 8px 6px 0 6px; border-color: #fff transparent transparent transparent; }
    .dir-left { left: 12px; border-width: 6px 8px 6px 0; border-color: transparent #fff transparent transparent; }
    .dir-right { right: 12px; border-width: 6px 0 6px 8px; border-color: transparent transparent transparent #fff; }

    .action-buttons { display: flex; gap: 8px; margin: 8px 0 2px; }
    .action-btn {
      flex: 1; padding: 7px 0; border-radius: 30px; font-weight: bold;
      border: none; color: white; display: flex; align-items: center;
      justify-content: center; gap: 5px; font-size: 0.75rem; cursor: pointer; transition: 0.15s;
    }
    .action-btn:active { transform: scale(0.95); }
    .start-btn { background: #2ecc71; color: #000; }
    .pause-btn { background: #e67e22; }
    .restart-btn { background: #3498db; }

    .game-over-screen {
      position: absolute; inset: 0; background: rgba(0,0,0,0.92); border-radius: 20px;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      z-index: 20; padding: 20px;
    }
    .game-over-screen h2 { color: #ff6b6b; font-size: 1.5rem; }
    .game-over-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 10px 0; width: 100%; max-width: 300px; }
    .game-over-stat { text-align: center; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 6px; }
    .game-over-stat .val { font-size: 1.2rem; font-weight: 800; color: #FFE484; }
    .game-over-stat .lbl { font-size: 0.55rem; opacity: 0.7; }
    .game-over-actions { display: flex; gap: 10px; margin-top: 10px; }
    .new-record-badge {
      background: linear-gradient(135deg, #FFD700, #FFA500); color: #000;
      padding: 4px 16px; border-radius: 30px; font-weight: 800; font-size: 0.8rem;
      display: none; margin-bottom: 6px; animation: recordPulse 1s ease-in-out infinite;
    }
    @keyframes recordPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }

    .scoreboard-container {
      max-width: 550px; width: 100%;
      background: rgba(0,0,0,0.4); border-radius: 24px; padding: 10px 12px;
      margin-top: 4px; margin-bottom: 6px;
    }
    .scoreboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .scoreboard-header h3 { color: #FFD966; font-size: 1rem; }
    .panel-btns { display: flex; gap: 4px; }
    .panel-btn {
      background: rgba(255,255,255,0.08); border: none; border-radius: 20px;
      padding: 4px 10px; color: #b9c3e6; font-size: 0.6rem; cursor: pointer;
      display: flex; align-items: center; gap: 4px; transition: 0.15s;
    }
    .panel-btn:active { background: rgba(255,255,255,0.15); }
    #scoreList { list-style: none; max-height: 140px; overflow-y: auto; padding: 0; margin: 0; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
    #scoreList::-webkit-scrollbar { width: 3px; }
    #scoreList::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 3px; }
    #scoreList::-webkit-scrollbar-thumb { background: #ffb347; border-radius: 3px; }

    .swipe-hint { font-size: 0.55rem; text-align: center; color: #8e99c0; margin-top: 4px; }

    .toast-msg {
      position: fixed; bottom: 25%; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.9); backdrop-filter: blur(12px);
      padding: 5px 16px; border-radius: 40px; font-size: 0.8rem;
      color: #FFD966; pointer-events: none; z-index: 200;
      white-space: nowrap; animation: fadePop 1.2s forwards;
    }
    @keyframes fadePop {
      0% { opacity: 0; transform: translate(-50%, 10px); }
      15% { opacity: 1; transform: translate(-50%, -5px); }
      85% { opacity: 1; transform: translate(-50%, -5px); }
      100% { opacity: 0; transform: translate(-50%, -20px); }
    }

    .achievement-popup {
      position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, #1a1a3e, #2a1a4e);
      border: 2px solid #FFD700; border-radius: 16px; padding: 10px 18px;
      display: flex; align-items: center; gap: 10px; z-index: 300;
      box-shadow: 0 0 30px rgba(255,215,0,0.3);
      animation: achPop 0.5s ease-out;
    }
    @keyframes achPop {
      0% { transform: translateX(-50%) translateY(-20px) scale(0.8); opacity: 0; }
      100% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
    }

    .overlay-panel {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
      z-index: 100; display: none; flex-direction: column; align-items: center;
      padding: 30px 16px; overflow-y: auto;
    }
    .overlay-panel.open { display: flex; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 450px; margin-bottom: 16px; }
    .panel-header h2 { font-size: 1.2rem; }
    .panel-close { background: rgba(255,255,255,0.1); border: none; border-radius: 50%; width: 32px; height: 32px; color: #fff; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .panel-content { width: 100%; max-width: 450px; }

    #achievementList { display: grid; gap: 8px; }
    .achievement-card {
      display: flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.04); border-radius: 12px; padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.06); transition: 0.2s;
    }
    .achievement-card.unlocked { border-color: rgba(255,215,0,0.3); background: rgba(255,215,0,0.05); }
    .achievement-card.locked { opacity: 0.5; }
    .ach-icon { font-size: 1.5rem; width: 36px; text-align: center; }
    .ach-name { font-weight: 700; font-size: 0.8rem; }
    .ach-desc { font-size: 0.65rem; opacity: 0.7; }
    .ach-progress { text-align: center; color: #FFD966; font-weight: 700; margin-bottom: 8px; }

    #statsList { display: grid; gap: 6px; }
    .stat-item { display: flex; justify-content: space-between; background: rgba(255,255,255,0.04); border-radius: 10px; padding: 8px 12px; }
    .stat-item-label { font-size: 0.75rem; color: #b9c3e6; }
    .stat-item-value { font-size: 0.85rem; font-weight: 700; color: #FFE484; }

    .settings-group { margin-bottom: 16px; }
    .settings-group h3 { font-size: 0.9rem; margin-bottom: 8px; color: #b9c3e6; }
    .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .setting-row label { font-size: 0.8rem; }
    .toggle-switch { position: relative; width: 44px; height: 24px; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; cursor: pointer; inset: 0; background: #444; border-radius: 24px; transition: 0.3s; }
    .toggle-slider::before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.3s; }
    .toggle-switch input:checked + .toggle-slider { background: #2ecc71; }
    .toggle-switch input:checked + .toggle-slider::before { transform: translateX(20px); }
    .danger-btn { background: #e74c3c; border: none; border-radius: 20px; padding: 8px 20px; color: #fff; font-weight: 700; cursor: pointer; width: 100%; font-size: 0.8rem; }
    .danger-btn:active { background: #c0392b; }

    .special-collect { display: flex; gap: 6px; justify-content: center; margin: 4px 0; }
    .special-dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 2px solid rgba(255,255,255,0.2); transition: 0.3s; }
    .special-dot.eaten { border-color: rgba(255,255,255,0.6); box-shadow: 0 0 6px currentColor; }

    @media (max-width: 460px) {
      .joystick-base { width: 100px; height: 100px; }
      .joystick-thumb { width: 55px; height: 55px; }
      .stat-value { font-size: 1.1rem; }
      .action-btn { padding: 6px 0; font-size: 0.7rem; }
      h1 { font-size: 1.3rem; }
    }
  </style>
  <script type="module" crossorigin src="/tcs/assets/index-Z0iz_Gzk.js"></script>
</head>
<body>
<div class="header">
  <h1><i class="fas fa-dragon"></i> 贪吃蛇·进化论</h1>
  <div class="subtitle">110px 精准摇杆 | 平滑插值 | 多重模式</div>
</div>

<div class="game-container">
  <div class="stats-row">
    <div class="stat-card"><div class="stat-value" id="score">0</div><div class="stat-label">分数</div></div>
    <div class="stat-card"><div class="stat-value" id="highScore">0</div><div class="stat-label">巅峰纪录</div></div>
    <div class="stat-card"><div class="stat-value" id="length">3</div><div class="stat-label">长度</div></div>
    <div class="stat-card"><div class="stat-value" id="extraInfo">∞</div><div class="stat-label" id="extraLabel">模式</div></div>
  </div>

  <div class="mode-bar">
    <button class="mode-btn active" data-mode="classic"><i class="fas fa-crown"></i> 经典</button>
    <button class="mode-btn" data-mode="timed"><i class="fas fa-hourglass-half"></i> 限时</button>
    <button class="mode-btn" data-mode="survival"><i class="fas fa-bolt"></i> 生存</button>
  </div>

  <div class="difficulty-selector" id="difficultyGroup">
    <button class="difficulty-btn" data-diff="easy"><i class="fas fa-leaf"></i> 简单</button>
    <button class="difficulty-btn active" data-diff="medium"><i class="fas fa-chart-line"></i> 中等</button>
    <button class="difficulty-btn" data-diff="hard"><i class="fas fa-skull"></i> 困难</button>
    <button class="difficulty-btn" data-diff="insane"><i class="fas fa-demon"></i> 疯狂</button>
  </div>

  <div class="game-area">
    <canvas id="gameCanvas"></canvas>
    <div class="combo-display" id="comboDisplay"></div>
    <div class="game-over-screen" id="gameOverScreen">
      <div class="new-record-badge" id="newRecordBadge"><i class="fas fa-crown"></i> 新纪录!</div>
      <h2>GAME OVER</h2>
      <div class="final-score" id="finalScore" style="font-size:2rem;font-weight:800;color:#FFE484;margin:4px 0;">0</div>
      <div class="game-over-stats">
        <div class="game-over-stat"><div class="val" id="finalLength">0</div><div class="lbl">长度</div></div>
        <div class="game-over-stat"><div class="val" id="finalCombo">0</div><div class="lbl">最大连击</div></div>
        <div class="game-over-stat"><div class="val" id="finalEaten">0</div><div class="lbl">食物</div></div>
        <div class="game-over-stat"><div class="val" id="finalSpecial">0</div><div class="lbl">特殊</div></div>
        <div class="game-over-stat" style="grid-column:span 2;"><div class="special-collect" id="specialTypesEaten"></div><div class="lbl">特殊收藏</div></div>
      </div>
      <div class="game-over-actions">
        <button class="action-btn restart-btn" id="restartGameOverBtn"><i class="fas fa-redo"></i> 重来</button>
        <button class="action-btn start-btn" id="menuBackBtn"><i class="fas fa-home"></i> 菜单</button>
      </div>
    </div>
    <div class="swipe-hint"><i class="fas fa-hand-peace"></i> 摇杆 / 画布滑动 / 键盘方向键</div>
  </div>

  <div class="special-timer-container"><div class="special-timer-bar" id="specialTimerBar"></div></div>

  <div class="joystick-container">
    <div class="joystick-base" id="joystickBase">
      <div class="dir-indicator dir-up"></div>
      <div class="dir-indicator dir-down"></div>
      <div class="dir-indicator dir-left"></div>
      <div class="dir-indicator dir-right"></div>
      <div class="joystick-thumb" id="joystickThumb"></div>
    </div>
  </div>

  <div class="action-buttons">
    <button class="action-btn start-btn" id="startBtn"><i class="fas fa-play"></i> 开始</button>
    <button class="action-btn pause-btn" id="pauseBtn"><i class="fas fa-pause"></i> 暂停</button>
    <button class="action-btn restart-btn" id="restartBtn"><i class="fas fa-sync-alt"></i> 重玩</button>
  </div>
</div>

<div class="scoreboard-container">
  <div class="scoreboard-header">
    <h3><i class="fas fa-trophy"></i> 荣誉殿堂</h3>
    <div class="panel-btns">
      <button class="panel-btn" data-panel="achievement"><i class="fas fa-medal"></i> 成就</button>
      <button class="panel-btn" data-panel="stats"><i class="fas fa-chart-bar"></i> 统计</button>
      <button class="panel-btn" data-panel="settings"><i class="fas fa-cog"></i></button>
    </div>
  </div>
  <ul id="scoreList"></ul>
</div>

<!-- Achievements Panel -->
<div class="overlay-panel" id="achievementPanel">
  <div class="panel-header">
    <h2><i class="fas fa-medal"></i> 成就系统</h2>
    <button class="panel-close"><i class="fas fa-times"></i></button>
  </div>
  <div class="panel-content">
    <div class="ach-progress">已解锁 <span id="achProgress">0 / 12</span></div>
    <div id="achievementList"></div>
  </div>
</div>

<!-- Stats Panel -->
<div class="overlay-panel" id="statsPanel">
  <div class="panel-header">
    <h2><i class="fas fa-chart-bar"></i> 游戏统计</h2>
    <button class="panel-close"><i class="fas fa-times"></i></button>
  </div>
  <div class="panel-content" id="statsList"></div>
</div>

<!-- Settings Panel -->
<div class="overlay-panel" id="settingsPanel">
  <div class="panel-header">
    <h2><i class="fas fa-cog"></i> 设置</h2>
    <button class="panel-close"><i class="fas fa-times"></i></button>
  </div>
  <div class="panel-content">
    <div class="settings-group">
      <h3>音频</h3>
      <div class="setting-row">
        <label>音效</label>
        <div class="toggle-switch">
          <input type="checkbox" id="soundToggle" checked>
          <span class="toggle-slider"></span>
        </div>
      </div>
    </div>
    <div class="settings-group">
      <h3>触觉</h3>
      <div class="setting-row">
        <label>振动反馈</label>
        <div class="toggle-switch">
          <input type="checkbox" id="vibrateToggle" checked>
          <span class="toggle-slider"></span>
        </div>
      </div>
    </div>
    <div class="settings-group">
      <h3>数据</h3>
      <button class="danger-btn" id="clearDataBtn"><i class="fas fa-trash"></i> 清除所有数据</button>
    </div>
  </div>
</div>

</body>
</html>
